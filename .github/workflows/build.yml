name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code. Even if a malicious pull request
# or a compromised build step ran here, the token could not push code or change the repo.
permissions:
  contents: read

# A newer push cancels an older, still-running build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Supply-chain check: refuse to run a gradle-wrapper.jar that isn't an official
      # Gradle release (a tampered wrapper would execute arbitrary code during the build).
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose their "executable" flag.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Build and publish the APK first, so a failing test or lint finding never blocks
      # getting the app (the run still turns red).
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RebahanGuard-apk
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 30

      # Runs every unit test (logic, fuzz, Robolectric) and records the UI screenshots.
      - name: Unit tests + screenshots
        run: ./gradlew recordRoborazziStandarDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          retention-days: 14

      - name: Android lint
        run: ./gradlew lintStandarDebug

      # Turn lint findings into annotations so they are readable on the public run page,
      # without downloading the report.
      - name: Annotate lint findings
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/reports/lint-results-*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except Exception as e:
                  print(f"could not parse {path}: {e}")
                  continue
              for issue in root.iter("issue"):
                  level = "error" if issue.get("severity") in ("Error", "Fatal") else "warning"
                  loc = issue.find("location")
                  file = loc.get("file", "") if loc is not None else ""
                  line = loc.get("line", "1") if loc is not None else "1"
                  msg = f'[{issue.get("id")}] {issue.get("message")}'.replace("\n", " ")
                  print(f"::{level} file={file},line={line}::{msg}")
          PY

      # Compile errors as annotations (readable on the public run page without logs access).
      - name: Annotate compile errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done

      # Turn failing tests into annotations as well.
      - name: Annotate test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for f in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (f.get("message") or f.text or "").replace("\n", " ")[:900]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*
          retention-days: 14

  # Puts the latest screenshots on the `screenshots` branch so they can be viewed (and fetched)
  # without downloading an artifact. A separate job: only it gets write access, never the build,
  # and only for pushes to main (never for pull requests).
  publish-screenshots:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots

      - name: Push to the screenshots branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# UI screenshots\n\nRendered by CI from %s.\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -qm "Screenshots for $GITHUB_SHA"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:screenshots
