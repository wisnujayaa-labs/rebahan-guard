name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code. Even if a malicious pull request
# or a compromised build step ran here, the token could not push code or change the repo.
permissions:
  contents: read

# A newer push cancels an older, still-running build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Supply-chain check: refuse to run a gradle-wrapper.jar that isn't an official
      # Gradle release (a tampered wrapper would execute arbitrary code during the build).
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose their "executable" flag.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests (incl. fuzz tests)
        run: ./gradlew testDebugUnitTest

      # Build and publish the APK before lint, so a lint finding never blocks getting the app.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RebahanGuard-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Android lint
        run: ./gradlew lintDebug

      # Turn lint findings into annotations so they are readable on the public run page,
      # without downloading the report.
      - name: Annotate lint findings
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/reports/lint-results-debug.xml") + glob.glob("app/build/intermediates/lint_intermediate_text_report/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception as e:
                  print(f"could not parse {path}: {e}")
                  continue
              for issue in root.iter("issue"):
                  level = "error" if issue.get("severity") in ("Error", "Fatal") else "warning"
                  loc = issue.find("location")
                  file = loc.get("file", "") if loc is not None else ""
                  line = loc.get("line", "1") if loc is not None else "1"
                  msg = f'[{issue.get("id")}] {issue.get("message")}'.replace("\n", " ")
                  print(f"::{level} file={file},line={line}::{msg}")
          PY

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14
