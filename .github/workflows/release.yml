name: Release

# Push a tag like v1.4.0 to publish a signed APK on the repository's Releases page.
# Or run it by hand from the Actions tab ("Run workflow") and type the version, e.g. v1.4.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v1.4.0"
        required: true

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check the version name
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.4.0 (got '$VERSION')"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the release key is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD repository secrets first."
            exit 1
          fi

      # The keystore exists only in the runner's temp folder for the length of this job.
      - name: Decode release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testStandarDebugUnitTest

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Two editions: the standard one installs from a file manager without Play Protect
      # blocking it; "ketat" adds strict mode (Accessibility), which Play Protect blocks there.
      - name: Name the APKs after the version
        run: |
          cp app/build/outputs/apk/standar/release/app-standar-release.apk "RebahanGuard-${VERSION}.apk"
          cp app/build/outputs/apk/ketat/release/app-ketat-release.apk "RebahanGuard-${VERSION}-ketat.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            RebahanGuard-${{ env.VERSION }}.apk
            RebahanGuard-${{ env.VERSION }}-ketat.apk
          generate_release_notes: true

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
